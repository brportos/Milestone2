[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable standalone maze generator module"
authors = [
    {name = "brportos"},
    {name = "herinaan"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.mypy.overrides]]
module = "mlx.*"
ignore_missing_imports = true